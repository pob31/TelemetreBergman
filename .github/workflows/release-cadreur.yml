# Builds, signs, notarizes and publishes Cadreur.app.
#
#   git tag cadreur-v2.0.0 && git push origin cadreur-v2.0.0
#
# Or run it by hand from the Actions tab, with "dry run" ticked to exercise
# signing and notarization without publishing anything.
#
# Secrets required (repository settings -> Secrets and variables -> Actions):
#   MACOS_CERT_P12_BASE64   Developer ID Application identity, .p12, base64
#   MACOS_CERT_PASSWORD     the password set when exporting that .p12
#   NOTARY_API_KEY_BASE64   App Store Connect API key (.p8), base64
#   NOTARY_API_KEY_ID       that key's ID
#   NOTARY_API_ISSUER       the issuer UUID
#
# This repo is PUBLIC, so the triggers matter: there is deliberately no
# pull_request trigger. Secrets are never exposed to a fork's pull request,
# and only someone who can push a tag to this repository can start a signed
# build.
name: Release Cadreur

on:
  push:
    tags: ["cadreur-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and notarize but publish nothing"
        type: boolean
        default: true

# Only what publishing a release needs.
permissions:
  contents: write

concurrency:
  group: release-cadreur-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Never attempt this on a fork: the secrets are not there and the job
    # would fail confusingly.
    if: github.repository == 'pob31/TelemetreBergman'
    runs-on: macos-15   # arm64, matching the target
    timeout-minutes: 45

    steps:
      # First-party actions only — nothing third-party gets near the signing key.
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        working-directory: cadreur-rs
        run: |
          rustup show          # honours rust-toolchain.toml, components included
          rustup component add clippy rustfmt   # no-op if already present
          rustc --version
          cargo clippy --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cadreur-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cadreur-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # A release must not ship untested. --locked fails if Cargo.lock would
      # need changing, so the published binary matches the committed lockfile.
      - name: Test
        working-directory: cadreur-rs
        run: cargo test --locked

      - name: Lint
        working-directory: cadreur-rs
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' cadreur-rs/Cargo.toml | head -1)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#cadreur-v}"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME says $TAG_VERSION but cadreur-rs/Cargo.toml says $CARGO_VERSION"
              exit 1
            fi
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $CARGO_VERSION"

      - name: Import the signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 is not set — see the header of this workflow"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/cadreur-signing.keychain-db"
          # Throwaway keychain, throwaway password, deleted in the final step.
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          rm -f "$RUNNER_TEMP/cert.p12"

          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # The identity name is not a secret: it is embedded in every signed
          # app and visible to anyone running spctl on the result.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in that .p12."
            echo "::error::Export the certificate AND its private key together."
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "CADREUR_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Stage the notary key
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and staple
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: ./scripts/build_app.sh --notarize

      - name: Verify the result as a recipient's Mac will see it
        run: |
          set -euo pipefail
          xcrun stapler validate dist/Cadreur.app
          spctl -a -vvv -t exec dist/Cadreur.app
          codesign --verify --strict --verbose=2 dist/Cadreur.app

      - name: Checksum
        id: package
        run: |
          set -euo pipefail
          cd dist
          ZIP="Cadreur-${{ steps.version.outputs.version }}.zip"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"
          echo "zip=dist/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || TAG="cadreur-v${VERSION}"
          NOTES="$(cat <<EOF
          Cadreur ${VERSION} — l'application de suivi de tulle pour Millumin.

          **Installation** : télécharger le zip, décompresser, glisser \`Cadreur.app\`
          où tu veux (Applications, une clé USB…), double-cliquer. Rien à installer :
          ni Python, ni dossier de projet à garder à côté.

          Signée par Developer ID et **notariée par Apple**, ticket agrafé — elle
          s'ouvre sans avertissement macOS et **sans connexion internet**.

          Tes calibrations vivent dans \`~/Library/Application Support/Cadreur/shows/\`
          et ne sont jamais touchées par une mise à jour.

          Apple Silicon (arm64), macOS 11 ou plus récent.
          EOF
          )"
          # A tag push has the tag already, so insist it exists rather than
          # silently creating a different one. A manual run creates it from
          # the commit being built.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            EXTRA=(--verify-tag)
          else
            EXTRA=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" \
            "${{ steps.package.outputs.zip }}" \
            "${{ steps.package.outputs.zip }}.sha256" \
            --title "Cadreur ${VERSION}" \
            --notes "$NOTES" \
            "${EXTRA[@]}"

      - name: Upload the build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadreur-app
          path: dist/
          retention-days: 7
          if-no-files-found: warn

      # Runs even when an earlier step failed, so the signing key never
      # outlives the job.
      - name: Destroy the credentials
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
