[package]
name = "cadreur"
version = "2.0.0"
edition = "2024"
rust-version = "1.98"
description = "Millumin scrim-tracking companion for the Bergman stage"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
rosc = "0.11"
# HTTP only, no TLS: the Pi serves plain HTTP on the stage LAN, and dropping
# TLS keeps the binary small. hyper's chunked decoding is battle-tested in a
# way a hand-rolled SSE reader would not be.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
axum = "0.8"
# The web UI is embedded from src/cadreur/web/ — one copy, shared with the
# Python build, so the two can never drift apart.
include_dir = "0.7"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
wry = "0.56.1"
tao = "0.37.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
