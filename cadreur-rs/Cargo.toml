[package]
name = "cadreur"
version = "2.0.0"
edition = "2024"
rust-version = "1.98"
description = "Millumin scrim-tracking companion for the Bergman stage"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
